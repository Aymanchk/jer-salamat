<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jer Salamat helps farmers in the Chuy Valley choose a smarter crop rotation with 40 years of NASA POWER climate data."
    />
    <meta name="theme-color" content="#070B0A" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jer Salamat — know what to plant next" />
    <meta
      property="og:description"
      content="Climate in the Chuy Valley is changing. Pick your field, answer 5 questions and get a crop rotation plan built on 40 years of NASA POWER climate data."
    />
    <meta name="twitter:card" content="summary" />
    <title>Jer Salamat — know what to plant next, with NASA climate data</title>
    <script>
      // Set the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('js-theme')
        // Dark is the default look; light is one tap away for bright sun.
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
