<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jer Salamat helps farmers in the Chuy Valley choose a smarter crop rotation with 40 years of NASA POWER climate data."
    />
    <meta name="theme-color" content="#1F4D3A" />
    <title>Jer Salamat — smarter crop rotation with NASA climate data</title>
    <script>
      // Set the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('js-theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
